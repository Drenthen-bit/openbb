[project]
name = "odp-terminal"
version = "1.0.0"
description = "A multi-panel trading and market-insights workspace built on the OpenBB Platform."
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<4"
dependencies = [
    "openbb-core>=2.0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Key-free data providers and routers used for live data.
data = [
    "openbb-equity", "openbb-index", "openbb-derivatives", "openbb-news", "openbb-economy",
    "openbb-fixedincome", "openbb-currency", "openbb-crypto", "openbb-commodity", "openbb-etf",
    "openbb-cboe", "openbb-nasdaq", "openbb-tmx", "openbb-sec", "openbb-finra",
    "openbb-federal-reserve", "openbb-fred",
]
ai = ["anthropic>=1"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
odp-terminal = "odp_terminal.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odp_terminal"]
artifacts = ["odp_terminal/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
